<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/style.css">
    <title>WildDex | Player Profile</title>
</head>

<body>

    <header>
        <h1>🌿 WILDDEX</h1>
        <p>PLAYER PROFILE</p>
    </header>

    <main class="container">

        <!-- player information -->
        <section class="card">
            <div class="profile-top">
                <div class="avatar">🐲</div>

                <div>
                    <h2 class="username">Chase</h2>
                    <span class="rank">⭐ LEVEL 2 EXPLORER</span>
                </div>
            </div>
        </section>

        <!-- XP progress -->
        <section class="card">
            <div class="xp-title">
                <span>EXPERIENCE</span>
                <span>60 / 100 XP</span>
            </div>

            <div class="xp-bar">
                <div class="xp-fill"></div>
            </div>
        </section>

        <!-- player statistics -->
        <section class="card">
            <h2>🏆 PLAYER STATS</h2>

            <div class="stats">
                <div class="stat">
                    <div class="stat-number">2</div>
                    <div class="stat-label">LEVEL</div>
                </div>

                <div class="stat">
                    <div class="stat-number">3</div>
                    <div class="stat-label">SPECIES DISCOVERED</div>
                </div>
            </div>
        </section>

        <!-- discovered animals -->
        <section class="card">
            <h2>🐾 MY DISCOVERIES</h2>

            <div class="discoveries">
                <div class="animal">
                    <div class="animal-icon">🐾</div>
                    QUOKKA
                </div>

                <div class="animal">
                    <div class="animal-icon">🐍</div>
                    DUGITE
                </div>

                <div class="animal">
                    <div class="animal-icon">🐦</div>
                    CRESTED TERN
                </div>
            </div>
        </section>

    </main>

</body>
</html>
